name: Extended C# Security - Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-csharp:
    name: C# Security Audit (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6 (Node.js 24)
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install -r .semgrep/requirements.txt

      - name: Validate rules, test examples, and fail on ERROR findings; save SARIF
        run: bash .github/scripts/run-sast.sh semgrep-csharp-report.sarif

      - name: Upload extended C# SARIF report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: semgrep-csharp-extended-report
          path: semgrep-csharp-report.sarif
          if-no-files-found: warn
          retention-days: 7
