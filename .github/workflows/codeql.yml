name: CodeQL - C# Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Private repositories require GitHub Code Security to run CodeQL.
# Set repository variable ENABLE_CODEQL=true only after code scanning is licensed/enabled.
jobs:
  codeql:
    name: CodeQL (C#)
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Restore dependencies
        run: dotnet restore SecureFileManager.sln --locked-mode

      - name: Build solution for CodeQL
        run: dotnet build SecureFileManager.sln -c Release --no-restore

      - name: Analyze C# code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
